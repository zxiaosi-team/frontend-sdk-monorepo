name: Test Actions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'test/v*'

jobs:
  test-echo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Print environment
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Actor: $GITHUB_ACTOR"

      - name: Simple echo
        run: |
          echo "Actions are working — test workflow ran at $(date)"
