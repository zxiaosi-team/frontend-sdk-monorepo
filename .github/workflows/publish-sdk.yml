# 当 push sdk/v* tag 时运行，如：在本地执行 git push origin sdk/v1.0.0
# 实际逻辑见可复用工作流 publish.yml
name: Publish And Release (sdk)

on:
  push:
    tags:
      - 'sdk/v*' # 最终用这个；测试时可改为 '*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 推荐 LTS
          registry-url: https://registry.npmjs.org/
          cache: ''

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm -C packages/sdk build

      - name: Publish to npmjs
        run: pnpm -C packages/sdk publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package dist for release
        run: tar -zcvf release.tgz -C packages/sdk ./dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GHP_TOKEN }}
          name: ${{ github.ref_name }}
          files: ./release.tgz
          body: |
            Please refer to [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/packages/sdk/CHANGELOG.md) for details.
